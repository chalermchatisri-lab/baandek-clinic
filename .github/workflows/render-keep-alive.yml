name: Render keep-alive

# Pings the Render /health endpoint every 10 minutes so the free-tier
# instance never sits idle long enough to spin down (~15 min).
# Without this, the first Messenger/LINE message after a quiet period
# would hang for up to 50s waiting for a cold start — long enough for
# Facebook to time out the webhook and drop the reply.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://baandek-clinic.onrender.com/health)
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Render health check did not return 200 (got $STATUS)"
          fi
